name: CPU tests

on:
  push:
  pull_request:

jobs:
  # Fast job: data pipeline, splits and leakage guards (numpy/pyarrow only).
  data-and-splits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project with data + dev extras
        run: python -m pip install -e '.[dev,data]'
      - name: Run tests
        run: python -m pytest -q

  # Separate job because the CPU torch wheel is ~200 MB: keep the fast job fast,
  # but still execute the model/training tests on every push.
  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU torch, project and data deps
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e '.[dev,data]'
      - name: Run full test suite (torch tests enabled)
        run: python -m pytest -q
      - name: Verify the documented commands work end to end
        run: |
          python scripts/make_synthetic_dataset.py --raw data/raw/ci_synthetic \
            --processed data/processed/ci_synthetic \
            --n-genes 60 --n-raw-features 64 --n-components 16
          python -m cofi_gene.train --config configs/b3.yaml \
            --dataset data/processed/ci_synthetic --out-dir runs/ci --epochs 4 \
            --run-name ci_b3
          test -f runs/ci/ci_b3/metrics.json
          # Week 3 models: B4 (gated fusion) and B5 (cross-graph attention)
          python -m cofi_gene.train --config configs/b4.yaml \
            --dataset data/processed/ci_synthetic --out-dir runs/ci --epochs 4 \
            --run-name ci_b4
          python -m cofi_gene.train --config configs/b5.yaml \
            --dataset data/processed/ci_synthetic --out-dir runs/ci --epochs 4 \
            --run-name ci_b5
          test -f runs/ci/ci_b4/metrics.json
          test -f runs/ci/ci_b5/metrics.json
          # Week 4 models: B6/B7 one-step edge-weight feedback.
          # --skip-test keeps the smoke honest (no test-split scoring) and cheap;
          # 2 epochs is enough to prove the second encoding pass trains.
          python -m cofi_gene.train --config configs/b6.yaml \
            --dataset data/processed/ci_synthetic --out-dir runs/ci --epochs 2 \
            --run-name ci_b6 --seed 42 --skip-test
          python -m cofi_gene.train --config configs/b7.yaml \
            --dataset data/processed/ci_synthetic --out-dir runs/ci --epochs 2 \
            --run-name ci_b7 --seed 42 --skip-test
          test -f runs/ci/ci_b6/metrics.json
          test -f runs/ci/ci_b7/metrics.json
          python - <<'PY'
          import json
          for name in ("ci_b6", "ci_b7"):
              record = json.load(open(f"runs/ci/{name}/metrics.json", encoding="utf-8"))
              model = record["model"]
              assert model["uses_feedback"] is True, name
              assert model["feedback"]["alpha"] == 0.1 and model["feedback"]["margin"] == 0.5
              assert record["test"] is None, f"{name} must not score the test split"
          print("B6/B7 feedback smoke OK")
          PY

