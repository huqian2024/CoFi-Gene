name: CPU tests

on:
  push:
  pull_request:

jobs:
  # Fast job: data pipeline, splits and leakage guards (numpy/pyarrow only).
  data-and-splits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project with data + dev extras
        run: python -m pip install -e '.[dev,data]'
      - name: Run tests
        run: python -m pytest -q
      - name: M5.1 data audit and non-neural baselines (numpy only)
        run: |
          python scripts/make_synthetic_dataset.py --raw data/raw/ci_synthetic \
            --processed data/processed/ci_synthetic \
            --n-genes 60 --n-raw-features 64 --n-components 16
          python scripts/audit_dataset.py --dataset data/processed/ci_synthetic \
            --out runs/ci_m51/audit.json
          python scripts/run_baselines.py --dataset data/processed/ci_synthetic \
            --out-dir runs/ci_m51/baselines --summary-name ci_baselines
          python - <<'PY'
          import json
          audit = json.load(open("runs/ci_m51/audit.json", encoding="utf-8"))
          assert audit["status"] == "PASS", audit["failed_ids"]
          ids = {check["id"] for check in audit["checks"]}
          assert any(check_id.startswith("C09") for check_id in ids)
          assert "A06-dataset-hash" in ids
          for channel, entry in audit["visibility"]["channels"].items():
              assert entry["num_test"] > 0, channel
          baselines = json.load(open("runs/ci_m51/baselines/ci_baselines.json",
                                     encoding="utf-8"))
          for channel in ("A", "B"):
              for name, entry in baselines["results"][channel].items():
                  assert 0.0 <= entry["average_precision"] <= 1.0, (channel, name)
                  assert entry["graph"] == "encode_edges"
          print("M5.1 audit + baselines smoke OK")
          PY

  # Separate job because the CPU torch wheel is ~200 MB: keep the fast job fast,
  # but still execute the model/training tests on every push.
  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU torch, project and data deps
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e '.[dev,data]'
      - name: Run full test suite (torch tests enabled)
        run: python -m pytest -q
      - name: Verify the documented commands work end to end
        run: |
          python scripts/make_synthetic_dataset.py --raw data/raw/ci_synthetic \
            --processed data/processed/ci_synthetic \
            --n-genes 60 --n-raw-features 64 --n-components 16
          python -m cofi_gene.train --config configs/b3.yaml \
            --dataset data/processed/ci_synthetic --out-dir runs/ci --epochs 4 \
            --run-name ci_b3
          test -f runs/ci/ci_b3/metrics.json
          # Week 3 models: B4 (gated fusion) and B5 (cross-graph attention)
          python -m cofi_gene.train --config configs/b4.yaml \
            --dataset data/processed/ci_synthetic --out-dir runs/ci --epochs 4 \
            --run-name ci_b4
          python -m cofi_gene.train --config configs/b5.yaml \
            --dataset data/processed/ci_synthetic --out-dir runs/ci --epochs 4 \
            --run-name ci_b5
          test -f runs/ci/ci_b4/metrics.json
          test -f runs/ci/ci_b5/metrics.json
          # Week 4 models: B6/B7 one-step edge-weight feedback.
          # --skip-test keeps the smoke honest (no test-split scoring) and cheap;
          # 2 epochs is enough to prove the second encoding pass trains.
          python -m cofi_gene.train --config configs/b6.yaml \
            --dataset data/processed/ci_synthetic --out-dir runs/ci --epochs 2 \
            --run-name ci_b6 --seed 42 --skip-test
          python -m cofi_gene.train --config configs/b7.yaml \
            --dataset data/processed/ci_synthetic --out-dir runs/ci --epochs 2 \
            --run-name ci_b7 --seed 42 --skip-test
          test -f runs/ci/ci_b6/metrics.json
          test -f runs/ci/ci_b7/metrics.json
          # Week 5 (M5): missing-edge protocol and the gene-correspondence control
          # must run end to end, and a zero-fraction run must stay unperturbed.
          python -m cofi_gene.train --config configs/b3.yaml \
            --dataset data/processed/ci_synthetic --out-dir runs/ci --epochs 2 \
            --run-name ci_b3_drop30 --seed 42 --edge-drop-fraction 0.3 --skip-test
          python -m cofi_gene.train --config configs/b5.yaml \
            --dataset data/processed/ci_synthetic --out-dir runs/ci --epochs 2 \
            --run-name ci_b5_misalign --seed 42 --misalign-cross-view --skip-test
          python -m cofi_gene.train --config configs/b4.yaml \
            --dataset data/processed/ci_synthetic --out-dir runs/ci --epochs 2 \
            --run-name ci_b4_zero --seed 42 --edge-drop-fraction 0.0 --skip-test
          python scripts/run_robustness.py --dataset data/processed/ci_synthetic \
            --models b1 --ratios 0 0.5 --epochs 1 --out-dir runs/ci_m5 \
            --summary-name ci_m5
          test -f runs/ci_m5/ci_m5.json
          test -f runs/ci_m5/ci_m5.md
          python - <<'PY'
          import json
          drop = json.load(open("runs/ci/ci_b3_drop30/metrics.json", encoding="utf-8"))
          assert drop["perturbation"]["edge_drop_fraction"] == 0.3
          assert drop["perturbation"]["channels"]["A"]["num_encode_edges_removed"] > 0
          assert drop["test"] is None, "smoke run must not score the test split"
          misaligned = json.load(open("runs/ci/ci_b5_misalign/metrics.json",
                                      encoding="utf-8"))
          assert misaligned["perturbation"]["misalign_cross_view"] is True
          assert misaligned["perturbation"]["cross_view"]["channel"] == "B"
          assert len(misaligned["perturbation"]["cross_view"]["permutation_sha256"]) == 16
          zero = json.load(open("runs/ci/ci_b4_zero/metrics.json", encoding="utf-8"))
          assert "perturbation" not in zero, "0.0 must be an unperturbed run"
          sweep = json.load(open("runs/ci_m5/ci_m5.json", encoding="utf-8"))
          assert set(sweep["table"]["average_precision"]["A"]["b1"]) == {"0.00", "0.50"}
          print("Week 5 robustness smoke OK")
          PY
          python - <<'PY'
          import json
          for name in ("ci_b6", "ci_b7"):
              record = json.load(open(f"runs/ci/{name}/metrics.json", encoding="utf-8"))
              model = record["model"]
              assert model["uses_feedback"] is True, name
              assert model["feedback"]["alpha"] == 0.1 and model["feedback"]["margin"] == 0.5
              assert record["test"] is None, f"{name} must not score the test split"
          print("B6/B7 feedback smoke OK")
          PY
      - name: M5.1 staged protocol smoke (supervision-aware removal + frozen eval)
        run: |
          python scripts/run_experiments.py --stage 4 \
            --dataset data/processed/ci_synthetic --only-models b1 \
            --only-ratios 0.5 --epochs 1 --out-dir runs/ci_m51/stage4
          python scripts/run_experiments.py --stage 1 \
            --dataset data/processed/ci_synthetic --only-models b1 \
            --epochs 1 --out-dir runs/ci_m51/stage1
          python scripts/run_experiments.py --stage 3 \
            --dataset data/processed/ci_synthetic --only-models b1 \
            --frozen-from runs/ci_m51/stage1 --out-dir runs/ci_m51/stage3
          python - <<'PY'
          import json
          stage4 = json.load(open(
              "runs/ci_m51/stage4/s4_b1_xfer_drop50_sup_seed42/metrics.json",
              encoding="utf-8"))
          protocol = stage4["protocol"]
          assert protocol["edge_removal_mode"] == "supervision_aware"
          assert protocol["visibility_protocol"] == "cross_view_transfer"
          assert stage4["status"] == "complete"
          assert stage4["audit"]["status"] == "PASS"
          removed = stage4["perturbation"]["channels"]["A"]["num_train_positives_removed"]
          assert removed > 0, "supervision-aware removal must drop training positives"
          evaluated = json.load(open(
              "runs/ci_m51/stage3/s3_b1_xfer_drop00_adj_seed42/eval.json",
              encoding="utf-8"))
          assert evaluated["model"] == "b1"
          assert evaluated["metrics"]["A"]["n_positives"] > 0
          print("M5.1 staged protocol smoke OK")
          PY

