# 真实数据管线模板（待团队成员补齐路径与已确认参数后再运行）
#
# 下载来源：
#   STRING  https://string-db.org/  -> 9606.protein.links.detailed.vXX.txt.gz
#                                    9606.protein.info.vXX.txt
#   gene_text  https://huggingface.co/datasets/arcinstitute/PIE_sources
#   PIE DE     https://huggingface.co/datasets/arcinstitute/PIE_replogle_nadig_essential
#
# 不要把原始数据提交进仓库：data/ 已在 .gitignore 中。
dataset_name: pending_real_v1

string_links: data/raw/string/9606.protein.links.detailed.v12.0.txt.gz
string_info: data/raw/string/9606.protein.info.v12.0.txt
gene_text: data/raw/pie_sources/gene_text.npy
gene_order: data/raw/pie_sources/gene_text.ids.txt

de_tables:
  K562: data/raw/pie/de/K562.parquet
  RPE1: data/raw/pie/de/RPE1.parquet
  HepG2: data/raw/pie/de/HepG2.parquet
  Jurkat: data/raw/pie/de/Jurkat.parquet

channel_column_a: experimental
channel_column_b: coexpression

# D-005 待确认：STRING 版本/species/通道阈值。下面 400/150 只是 STRING 文档里
# 常用的 medium/high-confidence 参考值，未获团队确认前不得写入论文表格。
min_score_a: 400
min_score_b: 150
weight_mode: none

# D-006 待确认：gene_text 3072 -> 128 的压缩方式（当前实现为固定符号的 SVD/PCA）
n_components: 128
standardize_features: false

# D-012 待确认：DE 标签规则
p_adj_threshold: 0.05
min_abs_log2fc: null

train_fraction: 0.8
val_fraction: 0.1
split_seed: 42
target_train_fraction: 0.7
target_val_fraction: 0.15
negatives_ratio: 1.0
negative_seed: 42
# D-014 待确认：是否启用"双视图均遮蔽"口径
mask_other_view: false
